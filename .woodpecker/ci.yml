# CI gate: JVM/KMP and backend tests, Android build and lint, web, docs,
# link check, OpenAPI lint and secret scan. iOS is excluded (needs macOS);
# the Compose smoke test is excluded (needs docker-in-docker).
# Local, without a server: `tools/ci/ci-local.sh` (Docker required).
# The jvm step mounts the Docker socket for the backend Testcontainers tests.
when:
  - event: [push, pull_request, manual]

steps:
  - name: jvm-android
    image: eclipse-temurin:21-jdk
    environment:
      ANDROID_HOME: /ci-android
      GRADLE_USER_HOME: /ci-gradle
      # Testcontainers (backend tests) starts PostGIS/SeaweedFS as siblings on the host Docker through the
      # mounted socket; the tests reach them on the host, not on the step container.
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    volumes:
      - ci-gradle:/ci-gradle
      - ci-android-sdk:/ci-android
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      # Docker Desktop already resolves this name to the engine VM, which is the right address for
      # published ports; overriding it with the bridge gateway makes Ryuk (and every other mapped
      # port) refuse the connection. On a plain Linux runner the name does not resolve, so add the
      # bridge gateway there. Assumes a /24 bridge, as Docker's default does.
      - getent hosts host.docker.internal >/dev/null 2>&1 || echo "$(hostname -i | awk '{print $1}' | sed 's/\.[0-9]*$/.1/') host.docker.internal" >> /etc/hosts
      - apt-get update -q && apt-get install -y -q unzip curl git
      - |
        if [ ! -x /ci-android/cmdline-tools/latest/bin/sdkmanager ]; then
          mkdir -p /ci-android/cmdline-tools
          curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          mv /tmp/cmdline-tools/cmdline-tools /ci-android/cmdline-tools/latest
        fi
      - yes | /ci-android/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
      - git config --global --add safe.directory '*'
      - ./gradlew check --console=plain
      - ./gradlew :apps:android:assembleDebug :apps:android:lintDebug --console=plain

  - name: web
    image: node:24
    volumes:
      - ci-npm:/root/.npm
    commands:
      - cd apps/web
      - npm ci
      - npm run check
      - npm run build
      - ls dist/assets | grep -q '^maplibre-gl-worker-.*\.js$'

  - name: docs
    image: node:24
    commands:
      # Ignores (frozen inputs, LICENSE, node_modules) are in .markdownlint-cli2.yaml.
      - npx --yes markdownlint-cli2@0.24.1 "**/*.md"
      # The API contract is YAML: parse it first, because a colon in a description is enough to make the
      # document unreadable. Then the semantic lint.
      - npx --yes js-yaml@5.5.0 docs/api/openapi.yaml > /dev/null
      - npx --yes @stoplight/spectral-cli@6.17.1 lint docs/api/openapi.yaml --ruleset .spectral.yaml --fail-severity error

  - name: links
    # lychee publishes no version tags on Docker Hub; v0.24.2 is pinned by digest.
    image: lycheeverse/lychee@sha256:eaff3e0a13603c9a701accfcc84f44158bb77bf36ecfa4622b626056c3463892
    commands:
      - lychee --config .lychee.toml --no-progress --extensions md .

  - name: secrets
    image: ghcr.io/gitleaks/gitleaks:v8.28.0
    commands:
      # The tree, not the history: the gate answers "does this commit add a secret?".
      # .gitleaks.toml keeps the generated and third-party folders out of the scan.
      - gitleaks dir . --config .gitleaks.toml --no-banner --redact --max-target-megabytes 20
