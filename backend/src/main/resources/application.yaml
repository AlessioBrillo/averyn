ktor:
  application:
    modules:
      - dev.averyn.backend.ApplicationKt.module
  deployment:
    port: "$PORT:8080"
    # Idle read timeout: a stalled upload does not hold a connection (and a thread) forever.
    requestReadTimeoutSeconds: 60

averyn:
  database:
    url: "$DATABASE_URL"
    user: "$DATABASE_USER"
    password: "$DATABASE_PASSWORD"
  # OIDC provider (ADR-0011): issuer URL, the audience tokens must carry, and the public client id apps sign in with.
  oidc:
    issuer: "$AVERYN_OIDC_ISSUER"
    audience: "$AVERYN_OIDC_AUDIENCE"
    clientId: "$AVERYN_OIDC_CLIENT_ID"
  # Raw activity files (ADR-0016): any S3-compatible store.
  s3:
    endpoint: "$AVERYN_S3_ENDPOINT"
    bucket: "$AVERYN_S3_BUCKET"
    accessKey: "$AVERYN_S3_ACCESS_KEY"
    secretKey: "$AVERYN_S3_SECRET_KEY"
