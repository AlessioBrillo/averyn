ktor:
  application:
    modules:
      - dev.averyn.backend.ApplicationKt.module
  deployment:
    port: "$PORT:8080"
    # Idle read timeout: a stalled upload does not hold a connection (and a thread) forever.
    requestReadTimeoutSeconds: 60

averyn:
  database:
    url: "$DATABASE_URL"
    user: "$DATABASE_USER"
    password: "$DATABASE_PASSWORD"
  # OIDC provider (ADR-0011): issuer URL, the audience tokens must carry, and the public client id apps sign in with.
  oidc:
    issuer: "$AVERYN_OIDC_ISSUER"
    audience: "$AVERYN_OIDC_AUDIENCE"
    clientId: "$AVERYN_OIDC_CLIENT_ID"
    webClientId: "$AVERYN_OIDC_WEB_CLIENT_ID"
    # Optional (ADR-0018): where the backend reaches the IdP when TLS ends at a proxy, e.g. http://idp:8081.
    internalUrl: "$?AVERYN_OIDC_INTERNAL_URL"
  # Web basemap (TDD-0003): a MapLibre style URL; optional, a demo style is used when unset.
  web:
    mapStyleUrl: "$?AVERYN_MAP_STYLE_URL"
  # Per-user limits (TDD-0005): authenticated requests per minute (default 120) and raw bytes stored (default 1 GiB).
  limits:
    requestsPerMinute: "$?AVERYN_RATE_LIMIT_PER_MINUTE"
    quotaBytes: "$?AVERYN_USER_QUOTA_BYTES"
  # Raw activity files (ADR-0016): any S3-compatible store.
  s3:
    endpoint: "$AVERYN_S3_ENDPOINT"
    bucket: "$AVERYN_S3_BUCKET"
    accessKey: "$AVERYN_S3_ACCESS_KEY"
    secretKey: "$AVERYN_S3_SECRET_KEY"
