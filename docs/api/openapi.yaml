openapi: 3.1.0
info:
  title: Averyn API
  version: 0.0.1
  description: |
    Contract-first: change this file in the same PR as the code.
    Versioning: breaking changes go to a new URL prefix (/v2); additive changes stay in /v1.
    Operational endpoints plus the MVP-1 sync surface (TDD-0002). Everything under /v1 except /v1/client-config
    requires a bearer token from the configured OIDC issuer (ADR-0011).
paths:
  /health:
    get:
      summary: Liveness — the process is up
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
  /ready:
    get:
      summary: Readiness — dependencies (database) are reachable
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "503":
          description: Not ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
  /metrics:
    get:
      summary: Prometheus metrics (internal network only)
      responses:
        "200":
          description: Prometheus text format
          content:
            text/plain: { schema: { type: string } }
  /v1/client-config:
    get:
      summary: OIDC settings a client needs to sign in (public)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClientConfig" }
  /v1/activities:
    get:
      summary: List the caller's activities, newest first (keyset pagination, TDD-0003)
      security: [{ oidc: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          description: Opaque; the nextCursor of the previous page.
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityPage" }
        "400": { description: limit out of range or malformed cursor }
        "401": { description: Missing or invalid token }
        "403": { description: The account was deleted (ADR-0017) }
        "429": { description: "Per-user request limit reached, retry after the Retry-After seconds (TDD-0005)" }
  /v1/activities/{clientActivityId}:
    put:
      summary: Upload a completed activity (idempotent, TDD-0002)
      security: [{ oidc: [] }]
      parameters:
        - name: clientActivityId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        description: The activity's JSON Lines file exactly as stored on the device (ADR-0015), max 32 MB.
        content:
          application/x-ndjson:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Already uploaded with identical bytes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivitySummary" }
        "201":
          description: Stored and summarised
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivitySummary" }
        "400": { description: Malformed activity id }
        "401": { description: Missing or invalid token }
        "429": { description: "Per-user request limit reached, retry after the Retry-After seconds (TDD-0005)" }
        "403": { description: The account was deleted (ADR-0017) }
        "409": { description: Same id already uploaded with different bytes }
        "410": { description: This activity id was deleted by its owner and is not accepted again (ADR-0017) }
        "413": { description: Body over the size limit }
        "422": { description: Unparseable file, no metadata, or activity not in a terminal state }
        "503": { description: Too many uploads in progress, retry after the Retry-After seconds }
        "507": { description: "Storing this file would exceed the caller's storage quota; nothing was stored (TDD-0005)" }
  /v1/activities/{id}:
    get:
      summary: Read one activity summary (owner only; 404 for anyone else)
      security: [{ oidc: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivitySummary" }
        "400": { description: Malformed activity id }
        "401": { description: Missing or invalid token }
        "403": { description: The account was deleted (ADR-0017) }
        "429": { description: "Per-user request limit reached, retry after the Retry-After seconds (TDD-0005)" }
        "404": { description: Not found, or not owned by the caller }
    delete:
      summary: Delete one activity and its raw file (owner only; 404 for anyone else, ADR-0017)
      security: [{ oidc: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Deleted; the same id can no longer be uploaded }
        "400": { description: Malformed activity id }
        "401": { description: Missing or invalid token }
        "429": { description: "Per-user request limit reached, retry after the Retry-After seconds (TDD-0005)" }
        "403": { description: The account was deleted }
        "404": { description: Not found, or not owned by the caller }
  /v1/activities/{id}/track:
    get:
      summary: The activity's track as GeoJSON (owner only; 404 for anyone else, TDD-0003)
      security: [{ oidc: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: A GeoJSON Feature; geometry is null when fewer than two samples counted towards the distance
          content:
            application/geo+json:
              schema:
                type: object
                properties:
                  type: { type: string, enum: [Feature] }
                  properties: { type: object, additionalProperties: true }
                  geometry:
                    type: [object, "null"]
                    description: "A MultiLineString: one line per continuous recording interval, so a pause is not a straight line through the gap"
        "400": { description: Malformed activity id }
        "401": { description: Missing or invalid token }
        "403": { description: The account was deleted (ADR-0017) }
        "429": { description: "Per-user request limit reached, retry after the Retry-After seconds (TDD-0005)" }
        "404": { description: Not found, or not owned by the caller }
  /v1/activities/{id}/analysis:
    get:
      summary: The analysis of the activity — the automatic splits, the elevation and the series (owner only; TDD-0009)
      description: >
        The analysis is computed by the shared code from the raw file the device uploaded, and it is stored with
        the version of the algorithm that produced it. An activity stored before the analysis existed, or one
        whose algorithms changed, is analysed the first time it is read: the first read can take a moment, and
        the answer is stored for the next ones.
      security: [{ oidc: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The analysis of the activity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityAnalysis" }
        "400": { description: Malformed activity id }
        "401": { description: Missing or invalid token }
        "403": { description: The account was deleted (ADR-0017) }
        "429": { description: "Per-user request limit reached, retry after the Retry-After seconds (TDD-0005)" }
        "404": { description: Not found, or not owned by the caller }
        "500": { description: The analysis could not be computed; the activity itself is untouched }
        "503": { description: Too many analyses in progress, retry after the Retry-After seconds }
  /v1/activities/{clientActivityId}/rr:
    put:
      summary: Upload the heart-rate sidecar of an activity (consent-gated, ADR-0021)
      description: >
        The sidecar is a separate object with its own lifecycle: it needs the `rr_recording` consent, it is
        deleted when that consent is withdrawn, and it is not part of the activity file. It must start with
        its own META line, and the activity must exist.
      security: [{ oidc: [] }]
      parameters:
        - name: clientActivityId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        description: The sidecar's JSON Lines file, max 32 MB.
        content:
          application/x-ndjson:
            schema: { type: string, format: binary }
      responses:
        "201": { description: Stored }
        "400": { description: Malformed activity id }
        "401": { description: Missing or invalid token }
        "403": { description: The `rr_recording` consent is not granted }
        "404": { description: The activity does not exist or is not owned by the caller }
        "410": { description: The sidecar was deleted (consent withdrawn) and is not accepted again }
        "413": { description: Body over the size limit }
        "422": { description: The file has no metadata line }
        "503": { description: Too many uploads in progress, retry after the Retry-After seconds }
        "507": { description: "Storing this file would exceed the caller's storage quota; nothing was stored" }
  /v1/imports/gpx:
    post:
      summary: Import a GPX file as an activity (TDD-0008)
      description: >
        The body is the file itself, not a form. The sport is explicit: a GPX `<type>` is free text and
        guessing it would label the activity with the wrong sport. The same file is imported once per owner:
        the second import answers 200 with the activity that exists. The uploaded file is kept byte-for-byte
        next to the canonical activity file.
      security: [{ oidc: [] }]
      parameters:
        - name: sport
          in: query
          required: true
          schema: { type: string, enum: [RUN, RIDE, WALK, HIKE] }
      requestBody:
        required: true
        description: The GPX file, max 32 MB.
        content:
          application/gpx+xml:
            schema: { type: string, format: binary }
          application/xml:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: This exact file was already imported; the activity that exists is returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResponse" }
        "201":
          description: Stored and summarised
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResponse" }
        "400": { description: Missing or unknown sport }
        "401": { description: Missing or invalid token }
        "403": { description: The account was deleted (ADR-0017) }
        "413": { description: Body over the size limit }
        "415": { description: The body is not a GPX file }
        "422": { description: The file is not a track this importer can read; the code says why }
        "429": { description: "Per-user request limit reached, retry after the Retry-After seconds (TDD-0005)" }
        "503": { description: Too many imports in progress, retry after the Retry-After seconds }
        "507": { description: "Storing this file would exceed the caller's storage quota; nothing was stored" }
  /v1/consents:
    get:
      summary: The caller's consent grants, granted and revoked (ADR-0021)
      security: [{ oidc: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConsentGrant" }
        "401": { description: Missing or invalid token }
  /v1/consents/{scope}:
    post:
      summary: Grant a consent scope (idempotent; ADR-0021)
      security: [{ oidc: [] }]
      parameters:
        - name: scope
          in: path
          required: true
          schema: { type: string, enum: [rr_recording, hrv_analysis] }
      responses:
        "201": { description: Granted }
        "400": { description: Missing or unknown scope }
        "401": { description: Missing or invalid token }
    delete:
      summary: Revoke a consent scope and delete the data it covers (ADR-0021)
      security: [{ oidc: [] }]
      parameters:
        - name: scope
          in: path
          required: true
          schema: { type: string, enum: [rr_recording, hrv_analysis] }
      responses:
        "204": { description: Revoked; the data it covered is deleted }
        "400": { description: Missing or unknown scope }
        "401": { description: Missing or invalid token }
  /v1/me:
    delete:
      summary: Delete all of the caller's data held by Averyn (idempotent; the identity at the IdP is not touched, ADR-0017)
      security: [{ oidc: [] }]
      responses:
        "204": { description: Deleted; any further call except this one answers 403 }
        "401": { description: Missing or invalid token }
        "429": { description: "Per-user request limit reached, retry after the Retry-After seconds (TDD-0005)" }
  /v1/me/export:
    get:
      summary: Download all of the caller's data as a ZIP (TDD-0004)
      description: >
        Entries: raw/{clientActivityId}.jsonl (byte-for-byte), original/{clientActivityId}.gpx (the file an
        imported activity was imported from), rr/{clientActivityId}.rr.jsonl (the heart-rate sidecar),
        gpx/{clientActivityId}.gpx, analysis/{clientActivityId}.json (the splits, the elevation, the series
        and the best efforts of the activity, TDD-0009 and TDD-0010), consents.json, records.json (the personal
        records of the account, TDD-0010) and activities.json (summaries and skipped-line counts, written
        last). Streamed.
      security: [{ oidc: [] }]
      responses:
        "200":
          description: The archive
          content:
            application/zip:
              schema: { type: string, format: binary }
        "401": { description: Missing or invalid token }
        "429": { description: "Per-user request limit reached, retry after the Retry-After seconds (TDD-0005)" }
        "403": { description: The account was deleted }
        "503": { description: Too many exports in progress, retry after the Retry-After seconds }
  /v1/me/records:
    get:
      summary: The personal records of the caller — the fastest effort of every sport and distance (TDD-0010)
      description: >
        A record is the fastest eligible best effort of the account for a sport and a distance. An activity is
        eligible when it finished, when it comes from Averyn or from a GPX file, and when its quality is not
        POOR. The number of activities that have no analysis yet is in `pendingActivities`: while it is not
        zero the list can be incomplete.
      security: [{ oidc: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonalRecords" }
        "401": { description: Missing or invalid token }
        "403": { description: The account was deleted (ADR-0017) }
        "429": { description: "Per-user request limit reached, retry after the Retry-After seconds (TDD-0005)" }
components:
  securitySchemes:
    oidc:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token issued by the OIDC provider named in /v1/client-config.
  schemas:
    ClientConfig:
      type: object
      required: [issuer, clientId, webClientId, mapStyleUrl, apiVersion]
      properties:
        issuer: { type: string, format: uri }
        clientId: { type: string, description: The native (mobile) OIDC app }
        webClientId: { type: string, description: The browser OIDC app (same project and audience) }
        mapStyleUrl: { type: string, format: uri, description: MapLibre style for the web basemap (deployment configuration) }
        apiVersion:
          type: integer
          description: "The version of the API contract this server speaks (TDD-0011). A client that does not understand it is warned, never refused: the read path is additive."
          example: 1
        minClientVersion:
          type: [string, "null"]
          description: The oldest app version this instance supports (semantic version), null when there is no minimum. A client below it is warned.
          example: "0.1.0"
    ActivitySummary:
      type: object
      required: [id, clientActivityId, sport, startedAt, finalState, distanceM, elapsedMs, movingMs, pausedMs, stationaryMs, averageSpeedMps, qualityGrade, droppedRecords, metricsAlgorithmVersion, qualityAlgorithmVersion, visibility]
      properties:
        id: { type: string, format: uuid }
        clientActivityId: { type: string, format: uuid }
        sport: { type: string, enum: [RUN, RIDE, WALK, HIKE] }
        startedAt: { type: string, format: date-time }
        finalState: { type: string, enum: [COMPLETED, FAILED] }
        distanceM: { type: number }
        elapsedMs: { type: integer, format: int64 }
        movingMs: { type: integer, format: int64 }
        pausedMs: { type: integer, format: int64 }
        stationaryMs: { type: integer, format: int64, description: "time-v1: the time the activity was recording and the user was not moving" }
        averageSpeedMps: { type: number, description: "speed-v1: distance over moving time; 0 while nothing moved" }
        paceSecPerKm: { type: [number, "null"], description: "speed-v1: 1000 / averageSpeedMps; null when the average speed is 0" }
        qualityGrade: { type: string, enum: [GOOD, FAIR, POOR, UNKNOWN], description: "UNKNOWN when the accuracy was never measured (an imported file, TDD-0008)" }
        droppedRecords: { type: integer, description: Stored lines that could not be read (counted, never silently dropped) }
        metricsAlgorithmVersion: { type: string, description: "Comma-separated, e.g. distance-v1,time-v1,speed-v1" }
        qualityAlgorithmVersion: { type: string }
        visibility: { type: string, enum: [private, followers, public, link] }
        avgHrBpm: { type: integer, description: "hr-v2: mean heart rate over the recording; 0 when there is none" }
        maxHrBpm: { type: integer, description: "hr-v2: maximum heart rate; 0 when there is none" }
        hrSource: { type: string, description: "Which sensor produced the heart rate (ble-hr, none, ...)" }
        hrAlgorithmVersion: { type: string, description: "The algorithm that computed the heart rate of this row" }
        source: { type: string, enum: [device, gpx, fit, tcx], description: "Where the activity comes from: recorded or imported (TDD-0008)" }
    ActivityAnalysis:
      type: object
      required: [schemaVersion, algorithmVersions, splitLengthM, totals, splits, series]
      properties:
        schemaVersion: { type: integer, description: The shape of this document; a new shape is a new number }
        algorithmVersions: { $ref: "#/components/schemas/AnalysisVersions" }
        splitLengthM: { type: number, description: "The length of a split: 1000 m, 5000 m for a ride" }
        totals: { $ref: "#/components/schemas/AnalysisTotals" }
        elevation:
          description: "Null when the activity carries no altitude at all"
          oneOf:
            - { $ref: "#/components/schemas/AnalysisElevation" }
            - { type: "null" }
        heartRate:
          description: "Null when the activity has no heart rate"
          oneOf:
            - { $ref: "#/components/schemas/AnalysisHeartRate" }
            - { type: "null" }
        splits:
          type: array
          items: { $ref: "#/components/schemas/AnalysisSplit" }
        bestEfforts:
          type: array
          description: "The fastest window of each target distance of the sport (best-efforts-v1)"
          items: { $ref: "#/components/schemas/BestEffort" }
        series: { $ref: "#/components/schemas/AnalysisSeries" }
    AnalysisVersions:
      type: object
      required: [splits, elevation, series, heartRate]
      properties:
        splits: { type: string, description: "e.g. splits-v1" }
        elevation: { type: string, description: "e.g. elevation-v1" }
        series: { type: string, description: "e.g. series-v1" }
        heartRate: { type: string, description: "e.g. hr-v2" }
        bestEfforts: { type: string, description: "e.g. best-efforts-v1" }
    BestEffort:
      type: object
      required: [distanceM, durationMs, elapsedMs, startDistanceM, endDistanceM, startElapsedMs, endElapsedMs, avgSpeedMps]
      properties:
        distanceM: { type: number, description: "The distance of the effort: one of the targets of the sport" }
        durationMs: { type: integer, format: int64, description: "The moving time of the effort: what a record is made of" }
        elapsedMs: { type: integer, format: int64, description: "The wall time of the effort, the stops inside it included" }
        startDistanceM: { type: number, description: "Where the effort starts, on the cumulative distance of the activity" }
        endDistanceM: { type: number, description: "Where the effort ends, on the cumulative distance of the activity" }
        startElapsedMs: { type: integer, format: int64, description: "When the effort starts, from the first sample of the activity" }
        endElapsedMs: { type: integer, format: int64, description: "When the effort ends, from the first sample of the activity" }
        avgSpeedMps: { type: number }
        paceSecPerKm: { type: [number, "null"], description: "Null when the effort does not move" }
    PersonalRecords:
      type: object
      required: [algorithmVersion, pendingActivities, sports]
      properties:
        algorithmVersion: { type: string, description: "The version of the algorithm that produced the numbers" }
        pendingActivities:
          type: integer
          description: "The activities of the account that have no analysis yet: the records can be incomplete while this is not zero"
        sports:
          type: array
          items: { $ref: "#/components/schemas/SportRecords" }
    SportRecords:
      type: object
      required: [sport, targets]
      properties:
        sport: { type: string, enum: [RUN, RIDE, WALK, HIKE] }
        targets:
          type: array
          items: { $ref: "#/components/schemas/RecordTarget" }
    RecordTarget:
      type: object
      required: [distanceM, record]
      properties:
        distanceM: { type: number, description: "The target distance of the sport" }
        record:
          description: "Null when the account has no record of this distance yet"
          oneOf:
            - { $ref: "#/components/schemas/PersonalRecord" }
            - { type: "null" }
    PersonalRecord:
      type: object
      required: [activityId, achievedAt, durationMs, elapsedMs, avgSpeedMps, source, qualityGrade]
      properties:
        activityId: { type: string, format: uuid, description: "The activity the record was made in" }
        achievedAt: { type: string, format: date-time, description: "When it was made: the start of the activity" }
        durationMs: { type: integer, format: int64, description: "The moving time of the effort" }
        elapsedMs: { type: integer, format: int64, description: "The wall time of the effort" }
        avgSpeedMps: { type: number }
        paceSecPerKm: { type: [number, "null"] }
        source: { type: string, enum: [device, gpx, fit, tcx], description: "Where the activity comes from" }
        qualityGrade: { type: string, enum: [GOOD, FAIR, POOR, UNKNOWN] }
    AnalysisTotals:
      type: object
      required: [distanceM, elapsedMs, movingMs, pausedMs, stationaryMs]
      properties:
        distanceM: { type: number }
        elapsedMs: { type: integer, format: int64 }
        movingMs: { type: integer, format: int64 }
        pausedMs: { type: integer, format: int64 }
        stationaryMs: { type: integer, format: int64 }
    AnalysisElevation:
      type: object
      required: [source, gainM, lossM, minM, maxM, avgM, coveragePercent]
      properties:
        source: { type: string, enum: [recorded], description: "The altitude comes from the samples, not from a digital elevation model" }
        gainM: { type: number, description: "elevation-v1: the climb, with a 3 m threshold" }
        lossM: { type: number, description: "elevation-v1: the descent, with a 3 m threshold" }
        minM: { type: number }
        maxM: { type: number }
        avgM: { type: number }
        coveragePercent: { type: number, description: "The share of the samples that carried an altitude" }
    AnalysisHeartRate:
      type: object
      required: [minBpm, avgBpm, maxBpm, coveragePercent, dropouts, artifacts]
      properties:
        minBpm: { type: integer }
        avgBpm: { type: integer }
        maxBpm: { type: integer }
        coveragePercent: { type: number, description: "hr-v2: the share of the recording time, the pauses excluded" }
        dropouts: { type: integer, description: "The expected 1 s intervals of the recording time without a usable sample" }
        artifacts: { type: integer, description: "The samples outside the plausible range: counted, never used" }
    AnalysisSplit:
      type: object
      required: [index, startDistanceM, endDistanceM, elapsedMs, movingMs, avgSpeedMps, partial]
      properties:
        index: { type: integer, description: "The 1-based position of the split" }
        startDistanceM: { type: number }
        endDistanceM: { type: number }
        elapsedMs: { type: integer, format: int64, description: "The wall time of the split, a pause inside it included" }
        movingMs: { type: integer, format: int64, description: "The time the user was moving: the pace is computed on this" }
        avgSpeedMps: { type: number }
        elevationGainM: { type: [number, "null"], description: "Null when the activity has no altitude" }
        elevationLossM: { type: [number, "null"], description: "Null when the activity has no altitude" }
        avgHrBpm: { type: [integer, "null"], description: "Null when the split has no heart-rate sample" }
        partial: { type: boolean, description: "True for the last split when the activity ended before the next boundary" }
    AnalysisSeries:
      type: object
      required: [distanceM, elevationM, elapsedMs, segment, heartRate]
      description: "A bounded, decimated drawing of the activity: the numbers to trust are the splits and the totals"
      properties:
        distanceM:
          type: array
          items: { type: number }
        elevationM:
          type: array
          items: { type: [number, "null"], description: "Null where the altitude is not known" }
        elapsedMs:
          type: array
          items: { type: integer, format: int64 }
        segment:
          type: array
          items: { type: integer, description: "The recording interval of the point: a change of number is a pause" }
        heartRate: { $ref: "#/components/schemas/AnalysisHeartRateSeries" }
    AnalysisHeartRateSeries:
      type: object
      required: [elapsedMs, bpm, segment]
      properties:
        elapsedMs:
          type: array
          items: { type: integer, format: int64 }
        bpm:
          type: array
          items: { type: integer }
        segment:
          type: array
          items: { type: integer, description: "The stretch of the point: a change of number is a dropout of the sensor" }
    ImportResponse:
      type: object
      required: [activity, import]
      properties:
        activity: { $ref: "#/components/schemas/ActivitySummary" }
        import: { $ref: "#/components/schemas/ImportReport" }
    ImportReport:
      type: object
      required: [source, duplicate, ignoredExtensions, parserVersion]
      properties:
        source: { type: string, description: "The format that was imported" }
        duplicate: { type: boolean, description: "True when this exact file was already imported" }
        segments: { type: [integer, "null"], description: "The number of track segments; null when the file was not parsed (a duplicate)" }
        points: { type: [integer, "null"], description: "The number of track points; null when the file was not parsed (a duplicate)" }
        ignoredExtensions: { type: object, additionalProperties: { type: integer }, description: "The extensions found in the file and not imported, by name" }
        parserVersion: { type: string }
    ConsentGrant:
      type: object
      required: [scope, grantedAt, revokedAt]
      properties:
        scope: { type: string }
        grantedAt: { type: string, format: date-time }
        revokedAt: { type: [string, "null"], format: date-time }
    ActivityPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ActivitySummary" }
        nextCursor: { type: [string, "null"], description: Null on the last page }
    Status:
      type: object
      required: [status]
      properties:
        status: { type: string }
