openapi: 3.1.0
info:
  title: Averyn API
  version: 0.1.0
  description: |
    Contract-first: change this file in the same PR as the code.
    Versioning: breaking changes go to a new URL prefix (/v2); additive changes stay in /v1.
    Operational endpoints plus the MVP-1 sync surface (TDD-0002). Everything under /v1 except /v1/client-config
    requires a bearer token from the configured OIDC issuer (ADR-0011).
    This is a pre-alpha contract: it describes what the code does today, not a stability promise.
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
  contact:
    name: Averyn maintainers
    url: https://github.com/AlessioBrillo/averyn/issues
externalDocs:
  description: API guide, versioning policy and how to lint the contract
  url: https://github.com/AlessioBrillo/averyn/blob/main/docs/api/README.md
servers:
  - url: http://localhost:8080
    description: Local self-hosted stack (plain HTTP)
  - url: https://your-instance.example
    description: A self-hosted instance; replace with your own origin
tags:
  - name: Operational
    description: Liveness, readiness and Prometheus metrics
  - name: Activities
    description: Sync, listing, detail, track, analysis and deletion
  - name: Imports
    description: GPX, FIT and archive import
  - name: Profile
    description: The caller's profile, privacy zones, consents and records
  - name: Social
    description: Public profile, follow, block, report, visibility (TDD-0018)
  - name: Account
    description: The caller's identity, export and account deletion
paths:
  /health:
    get:
      summary: Liveness — the process is up
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
  /ready:
    get:
      summary: Readiness — dependencies (database) are reachable
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "503":
          description: Not ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
  /metrics:
    get:
      summary: Prometheus metrics (internal network only)
      responses:
        "200":
          description: Prometheus text format
          content:
            text/plain: { schema: { type: string } }
  /v1/client-config:
    get:
      summary: OIDC settings a client needs to sign in (public)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClientConfig" }
  /v1/activities:
    get:
      summary: List the caller's activities, newest first (keyset pagination, TDD-0003)
      security: [{ oidc: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          description: Opaque; the nextCursor of the previous page.
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityPage" }
        "400": { description: limit out of range or malformed cursor }
        "401": { description: Missing or invalid token }
        "403": { description: The account was deleted (ADR-0017) }
        "429": { description: "Per-user request limit reached, retry after the Retry-After seconds (TDD-0005)" }
  /v1/activities/{id}:
    put:
      summary: Upload a completed activity (idempotent, TDD-0002)
      description: >
        `id` is the activity's client id. The first upload stores it and answers 201; uploading the same bytes
        again answers 200 with the same activity.
      security: [{ oidc: [] }]
      parameters:
        - name: id
          in: path
          required: true
          description: The activity's client id, the same value returned as `clientActivityId` in the summary.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        description: The activity's JSON Lines file exactly as stored on the device (ADR-0015), max 32 MB.
        content:
          application/x-ndjson:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Already uploaded with identical bytes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivitySummary" }
        "201":
          description: Stored and summarised
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivitySummary" }
        "400": { description: Malformed activity id }
        "401": { description: Missing or invalid token }
        "429": { description: "Per-user request limit reached, retry after the Retry-After seconds (TDD-0005)" }
        "403": { description: The account was deleted (ADR-0017) }
        "409": { description: Same id already uploaded with different bytes }
        "410": { description: This activity id was deleted by its owner and is not accepted again (ADR-0017) }
        "413": { description: Body over the size limit }
        "422": { description: "Unparseable file, no metadata, or activity not in a terminal state" }
        "503": { description: "Too many uploads in progress, retry after the Retry-After seconds" }
        "507": { description: "Storing this file would exceed the caller's storage quota; nothing was stored (TDD-0005)" }
    get:
      summary: Read one activity summary (owner only; 404 for anyone else)
      security: [{ oidc: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivitySummary" }
        "400": { description: Malformed activity id }
        "401": { description: Missing or invalid token }
        "403": { description: The account was deleted (ADR-0017) }
        "429": { description: "Per-user request limit reached, retry after the Retry-After seconds (TDD-0005)" }
        "404": { description: "Not found, or not owned by the caller" }
    delete:
      summary: Delete one activity and its raw file (owner only; 404 for anyone else, ADR-0017)
      security: [{ oidc: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Deleted; the same id can no longer be uploaded }
        "400": { description: Malformed activity id }
        "401": { description: Missing or invalid token }
        "429": { description: "Per-user request limit reached, retry after the Retry-After seconds (TDD-0005)" }
        "403": { description: The account was deleted }
        "404": { description: "Not found, or not owned by the caller" }
  /v1/activities/{id}/track:
    get:
      summary: The activity's track as GeoJSON (owner only; 404 for anyone else, TDD-0003)
      security: [{ oidc: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: "A GeoJSON Feature, with the owner's privacy zones cut out (TDD-0016, a hidden stretch breaks the line; the file and the export keep every sample); geometry is null when fewer than two samples counted towards the distance or every point is inside a zone"
          content:
            application/geo+json:
              schema:
                type: object
                properties:
                  type: { type: string, enum: [Feature] }
                  properties: { type: object, additionalProperties: true }
                  geometry:
                    type: [object, "null"]
                    description: "A MultiLineString: one line per continuous recording interval, so a pause is not a straight line through the gap"
        "400": { description: Malformed activity id }
        "401": { description: Missing or invalid token }
        "403": { description: The account was deleted (ADR-0017) }
        "429": { description: "Per-user request limit reached, retry after the Retry-After seconds (TDD-0005)" }
        "404": { description: "Not found, or not owned by the caller" }
  /v1/activities/{id}/analysis:
    get:
      summary: The analysis of the activity — the automatic splits, the elevation and the series (owner only; TDD-0009)
      description: >
        The analysis is computed by the shared code from the raw file the device uploaded, and it is stored with
        the version of the algorithm that produced it. An activity stored before the analysis existed, or one
        whose algorithms changed, is analysed the first time it is read: the first read can take a moment, and
        the answer is stored for the next ones.
      security: [{ oidc: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The analysis of the activity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityAnalysis" }
        "400": { description: Malformed activity id }
        "401": { description: Missing or invalid token }
        "403": { description: The account was deleted (ADR-0017) }
        "429": { description: "Per-user request limit reached, retry after the Retry-After seconds (TDD-0005)" }
        "404": { description: "Not found, or not owned by the caller" }
        "500": { description: The analysis could not be computed; the activity itself is untouched }
        "503": { description: "Too many analyses in progress, retry after the Retry-After seconds" }
  /v1/activities/{id}/rr:
    put:
      summary: Upload the heart-rate sidecar of an activity (consent-gated, ADR-0021)
      description: >
        The sidecar is a separate object with its own lifecycle: it needs the `rr_recording` consent, it is
        deleted when that consent is withdrawn, and it is not part of the activity file. It must start with
        its own META line, and the activity must exist.
      security: [{ oidc: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        description: The sidecar's JSON Lines file, max 32 MB.
        content:
          application/x-ndjson:
            schema: { type: string, format: binary }
      responses:
        "201": { description: Stored }
        "400": { description: Malformed activity id }
        "401": { description: Missing or invalid token }
        "403": { description: The `rr_recording` consent is not granted }
        "404": { description: The activity does not exist or is not owned by the caller }
        "410": { description: The sidecar was deleted (consent withdrawn) and is not accepted again }
        "413": { description: Body over the size limit }
        "422": { description: The file has no metadata line }
        "503": { description: "Too many uploads in progress, retry after the Retry-After seconds" }
  /v1/activities/{id}/synapse/{kind}:
    put:
      summary: Upload what a Synapse band sent during an activity (consent-gated, ADR-0030)
      description: >
        `kind` is `features` (the consumer records at about 1 Hz; consent `signal_quality`) or `raw` (the research
        frames; consent `raw_signals`). The file is stored as received, with one exception: in a `features`
        file the fields of a scope that is not granted (stress, RR, the band's RMSSD/SDNN) are set to "not
        available" before it is stored (ADR-0021). The activity must exist, and the file needs at least one whole record.
      security: [{ oidc: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: kind
          in: path
          required: true
          schema: { type: string, enum: [features, raw] }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "204": { description: Stored }
        "400": { description: Malformed activity id }
        "401": { description: Missing or invalid token }
        "403": { description: The consent of that kind is not granted }
        "404": { description: "Unknown kind, or the activity does not exist or is not owned by the caller" }
        "410": { description: The sidecar was deleted (consent withdrawn) and is not accepted again }
        "413": { description: Body over the size limit }
        "422": { description: The file has no whole record }
        "507": { description: Storage quota exceeded }
  /v1/activities/{id}/synapse:
    get:
      summary: What the band recorded in an activity, as the consents allow (SynapseSummaryDto)
      security: [{ oidc: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The summary; a field is null when its sidecar is absent or its consent was withdrawn
          content:
            application/json:
              schema: { type: object, description: SynapseSummaryDto in shared/api }
        "401": { description: Missing or invalid token }
        "404": { description: The activity does not exist or is not owned by the caller }
  /v1/activities/{id}/synapse/raw/{stream}:
    get:
      summary: A bounded window of one raw stream, decimated to at most `maxPoints` per segment (SynapseWindowDto)
      security: [{ oidc: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: stream
          in: path
          required: true
          schema: { type: string }
        - name: from
          in: query
          description: Start of the window in milliseconds since the start of the recording
          schema: { type: integer, format: int64, default: 0 }
        - name: to
          in: query
          description: End of the window, in the same unit; must be after `from`
          schema: { type: integer, format: int64 }
        - name: maxPoints
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: The window, in the contract's units
          content:
            application/json:
              schema: { type: object, description: SynapseWindowDto in shared/api }
        "400": { description: Malformed activity id or an empty window }
        "401": { description: Missing or invalid token }
        "403": { description: The `raw_signals` consent is not granted }
        "404": { description: "Unknown stream, a stream that was not recorded, or no such activity" }
        "507": { description: "Storing this file would exceed the caller's storage quota; nothing was stored" }
  /v1/imports/gpx:
    post:
      summary: Import a GPX file as an activity (TDD-0008)
      description: >
        The body is the file itself, not a form. The sport is explicit: a GPX `<type>` is free text and
        guessing it would label the activity with the wrong sport. The same file is imported once per owner:
        the second import answers 200 with the activity that exists. The uploaded file is kept byte-for-byte
        next to the canonical activity file.
      security: [{ oidc: [] }]
      parameters:
        - name: sport
          in: query
          required: true
          schema: { type: string, enum: [RUN, RIDE, WALK, HIKE] }
      requestBody:
        required: true
        description: The GPX file, max 32 MB.
        content:
          application/gpx+xml:
            schema: { type: string, format: binary }
          application/xml:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: This exact file was already imported; the activity that exists is returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResponse" }
        "201":
          description: Stored and summarised
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResponse" }
        "400": { description: Missing or unknown sport }
        "401": { description: Missing or invalid token }
        "403": { description: The account was deleted (ADR-0017) }
        "413": { description: Body over the size limit }
        "415": { description: The body is not a GPX file }
        "422": { description: The file is not a track this importer can read; the code says why }
        "429": { description: "Per-user request limit reached, retry after the Retry-After seconds (TDD-0005)" }
        "503": { description: "Too many imports in progress, retry after the Retry-After seconds" }
        "507": { description: "Storing this file would exceed the caller's storage quota; nothing was stored" }
  /v1/imports/fit:
    post:
      summary: Import a FIT activity file as an activity (TDD-0013)
      description: >
        The body is the file itself, not a form. A FIT file declares its sport, so `sport` is optional here and wins
        when given; a file that declares none the importer knows is `422 sport_unknown`. The file is checked (its
        CRC, its structure, that it is an activity), its records become the track (a stopped timer is a pause) and
        its heart rate is imported; the fields the importer does not read (cadence, power, developer data) are
        counted in `ignoredExtensions`. The same file is imported once per owner. The uploaded file is kept
        byte-for-byte next to the canonical activity file.
      security: [{ oidc: [] }]
      parameters:
        - name: sport
          in: query
          required: false
          schema: { type: string, enum: [RUN, RIDE, WALK, HIKE] }
      requestBody:
        required: true
        description: The FIT file, max 32 MB.
        content:
          application/vnd.ant.fit:
            schema: { type: string, format: binary }
          application/fit:
            schema: { type: string, format: binary }
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: This exact file was already imported; the activity that exists is returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResponse" }
        "201":
          description: Stored and summarised
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResponse" }
        "400": { description: Unknown sport }
        "401": { description: Missing or invalid token }
        "403": { description: The account was deleted (ADR-0017) }
        "413": { description: Body over the size limit }
        "415": { description: The body type is not one a FIT file is sent with }
        "422": { description: "The file is not an activity this importer can read; the code says why (not_fit, fit_crc, fit_truncated, fit_structure, fit_not_activity, no_track, invalid_time, invalid_coordinate, too_many_points, sport_unknown)" }
        "429": { description: "Per-user request limit reached, retry after the Retry-After seconds (TDD-0005)" }
        "503": { description: "Too many imports in progress, retry after the Retry-After seconds" }
        "507": { description: "Storing this file would exceed the caller's storage quota; nothing was stored" }
  /v1/imports/archive:
    post:
      summary: Import the activity files of a ZIP archive (TDD-0013)
      description: >
        The body is the archive itself (max 256 MB). Every `.fit` and `.gpx` file in it, also gzipped (`.fit.gz`,
        `.gpx.gz`), goes through the same import as a single upload: the same checks, the same quota, the same
        duplicate rule, the original kept byte-for-byte. A file that cannot be imported does not stop the others:
        it is a line of the report with its code. `sport` is optional: it wins over the sport a FIT file declares
        and is the only sport a GPX file can have. Limits: 100 activity files per request, 5 000 entries listed,
        32 MB per file and 256 MB in total after decompression; a bigger archive is imported in several parts.
      security: [{ oidc: [] }]
      parameters:
        - name: sport
          in: query
          required: false
          schema: { type: string, enum: [RUN, RIDE, WALK, HIKE] }
      requestBody:
        required: true
        content:
          application/zip:
            schema: { type: string, format: binary }
          application/x-zip-compressed:
            schema: { type: string, format: binary }
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: The archive was read; the report says what happened to each file
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArchiveReport" }
        "400": { description: Unknown sport }
        "401": { description: Missing or invalid token }
        "403": { description: The account was deleted (ADR-0017) }
        "413": { description: Body over the size limit }
        "415": { description: The body is not a ZIP archive }
        "422": { description: "The archive as a whole cannot be imported (zip_error, archive_too_large); nothing was stored" }
        "429": { description: "Per-user request limit reached, retry after the Retry-After seconds (TDD-0005)" }
        "503": { description: "Too many imports in progress, retry after the Retry-After seconds" }
  /v1/consents:
    get:
      summary: The caller's consent grants, granted and revoked (ADR-0021)
      security: [{ oidc: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConsentGrant" }
        "401": { description: Missing or invalid token }
  /v1/consents/{scope}:
    post:
      summary: Grant a consent scope (idempotent; ADR-0021)
      security: [{ oidc: [] }]
      parameters:
        - name: scope
          in: path
          required: true
          schema: { type: string, enum: [rr_recording, hrv_analysis, signal_quality, stress_monitoring, raw_signals] }
      responses:
        "201": { description: Granted }
        "400": { description: Missing or unknown scope }
        "401": { description: Missing or invalid token }
    delete:
      summary: Revoke a consent scope and delete the data it covers (ADR-0021)
      security: [{ oidc: [] }]
      parameters:
        - name: scope
          in: path
          required: true
          schema: { type: string, enum: [rr_recording, hrv_analysis, signal_quality, stress_monitoring, raw_signals] }
      responses:
        "204": { description: Revoked; the data it covered is deleted }
        "400": { description: Missing or unknown scope }
        "401": { description: Missing or invalid token }
  /v1/profile:
    get:
      summary: The caller's profile, the settings every client shares (TDD-0012)
      description: An account that never saved a profile gets the defaults (metric units, no maximum heart rate).
      security: [{ oidc: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
        "401": { description: Missing or invalid token }
        "403": { description: The account was deleted }
    put:
      summary: Replace the caller's profile (TDD-0012)
      security: [{ oidc: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserProfile" }
      responses:
        "200":
          description: Stored; the body is the stored profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
        "401": { description: Missing or invalid token }
        "403": { description: The account was deleted }
        "422": { description: "Not a valid profile (unknown unit system, maximum heart rate out of 100–230); nothing was stored" }
  /v1/privacy-zones:
    get:
      summary: The caller's privacy zones, places hidden on every map and card (TDD-0016)
      description: An account that never saved any has none. A zone is a circle; the centre is usually a home, so it is Restricted data.
      security: [{ oidc: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivacyZones" }
        "401": { description: Missing or invalid token }
        "403": { description: The account was deleted }
    put:
      summary: Replace the caller's privacy zones as a whole (TDD-0016)
      security: [{ oidc: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrivacyZones" }
      responses:
        "200":
          description: Stored; the body is the stored list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivacyZones" }
        "401": { description: Missing or invalid token }
        "403": { description: The account was deleted }
        "422": { description: "Not a valid list (more than 10 zones, a radius outside 50–2000 m, a coordinate out of range, a label over 40 characters, a body over 4 kB); nothing was stored. The answer never repeats a coordinate" }
  /v1/me/public-profile:
    get:
      summary: The caller's public profile, as the owner edits it (TDD-0018)
      security: [{ oidc: [] }]
      tags: [Social]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialProfile" }
        "401": { description: Missing or invalid token }
        "403": { description: The account was deleted }
        "429": { description: "Per-user request limit reached, retry after the Retry-After seconds (TDD-0005)" }
    put:
      summary: Save the public profile (TDD-0018 F8)
      description: A null handle keeps the current one. A handle is 3-30 characters of a-z, 0-9, _ and ., stored in lower case, unique, not reserved, and needs ageConfirmed (16 or older). The first handle and the first change are free; after that one change every 30 days.
      security: [{ oidc: [] }]
      tags: [Social]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SocialProfile" }
      responses:
        "200":
          description: Stored; the body is the stored profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialProfile" }
        "409": { description: "The handle is taken, or it changed less than 30 days ago" }
        "422": { description: "Not a valid profile; nothing was stored" }
        "401": { description: Missing or invalid token }
        "403": { description: The account was deleted }
        "429": { description: "Per-user request limit reached, retry after the Retry-After seconds (TDD-0005)" }
  /v1/me/avatar:
    put:
      summary: Set the avatar (TDD-0018 F9)
      description: The body is the picture itself (JPEG, PNG or GIF, at most 5 MB and 25 megapixels). The server cuts the central square, scales it to 256 px and writes a new JPEG, so no metadata survives.
      security: [{ oidc: [] }]
      tags: [Social]
      requestBody:
        required: true
        content:
          image/*: { schema: { type: string, format: binary } }
      responses:
        "200":
          description: Stored; the body is the profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialProfile" }
        "413": { description: Over 5 MB }
        "422": { description: Not a picture the server can read }
        "401": { description: Missing or invalid token }
        "403": { description: The account was deleted }
        "429": { description: "Per-user request limit reached, retry after the Retry-After seconds (TDD-0005)" }
    delete:
      summary: Remove the avatar
      security: [{ oidc: [] }]
      tags: [Social]
      responses:
        "204": { description: Removed }
        "401": { description: Missing or invalid token }
        "403": { description: The account was deleted }
        "429": { description: "Per-user request limit reached, retry after the Retry-After seconds (TDD-0005)" }
  /v1/activities/{id}/visibility:
    put:
      summary: Set who may see one of the caller's activities (TDD-0018 F1, F10)
      description: private, followers, public or link. link returns an unguessable shareToken (kept if it already has one); any other value clears it, so an old link stops working at once.
      security: [{ oidc: [] }]
      tags: [Social]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VisibilityRequest" }
      responses:
        "200":
          description: Set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VisibilityResult" }
        "404": { description: Not the caller's activity }
        "422": { description: Not a visibility }
        "401": { description: Missing or invalid token }
        "403": { description: The account was deleted }
        "429": { description: "Per-user request limit reached, retry after the Retry-After seconds (TDD-0005)" }
  /v1/users/by-handle/{handle}:
    get:
      summary: The card of a person by handle
      security: [{ oidc: [] }]
      tags: [Social]
      parameters:
        - { name: handle, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserCard" }
        "404": { description: "Not visible to the caller or not existing: the two look the same (TDD-0018 F3)" }
        "401": { description: Missing or invalid token }
        "403": { description: The account was deleted }
        "429": { description: "Per-user request limit reached, retry after the Retry-After seconds (TDD-0005)" }
  /v1/users/{id}:
    get:
      summary: The card of a person (TDD-0018 F2)
      description: A private profile shows only the handle and the name to people who do not follow (restricted = true). A person who blocked the caller does not exist for the caller. Every response on /v1/users/ carries X-Robots-Tag noindex.
      security: [{ oidc: [] }]
      tags: [Social]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserCard" }
        "404": { description: "Not visible to the caller or not existing: the two look the same (TDD-0018 F3)" }
        "401": { description: Missing or invalid token }
        "403": { description: The account was deleted }
        "429": { description: "Per-user request limit reached, retry after the Retry-After seconds (TDD-0005)" }
  /v1/users/{id}/avatar:
    get:
      summary: The avatar of a person (a 256 px JPEG)
      security: [{ oidc: [] }]
      tags: [Social]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: OK, content: { image/jpeg: { schema: { type: string, format: binary } } } }
        "404": { description: "Not visible to the caller or not existing: the two look the same (TDD-0018 F3)" }
        "401": { description: Missing or invalid token }
        "403": { description: The account was deleted }
        "429": { description: "Per-user request limit reached, retry after the Retry-After seconds (TDD-0005)" }
  /v1/users/{id}/activities:
    get:
      summary: The activities of a person that the caller may see, newest first (TDD-0018 F3, F4)
      description: Only the summary, never a heart-rate, RR, HRV or stress value. A visibility of link is never listed. A person whose activities are all hidden from the caller gives an empty page, not an error.
      security: [{ oidc: [] }]
      tags: [Social]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicActivityPage" }
        "400": { description: "Malformed id, limit or cursor" }
        "404": { description: "Not visible to the caller or not existing: the two look the same (TDD-0018 F3)" }
        "401": { description: Missing or invalid token }
        "403": { description: The account was deleted }
        "429": { description: "Per-user request limit reached, retry after the Retry-After seconds (TDD-0005)" }
  /v1/users/{id}/activities/{aid}:
    get:
      summary: One activity of a person, as the caller may see it
      security: [{ oidc: [] }]
      tags: [Social]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: aid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicActivity" }
        "404": { description: "Not visible to the caller or not existing: the two look the same (TDD-0018 F3)" }
        "401": { description: Missing or invalid token }
        "403": { description: The account was deleted }
        "429": { description: "Per-user request limit reached, retry after the Retry-After seconds (TDD-0005)" }
  /v1/users/{id}/activities/{aid}/track:
    get:
      summary: The track of such an activity, with the owner's privacy zones cut out (TDD-0016, TDD-0018 F3)
      security: [{ oidc: [] }]
      tags: [Social]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: aid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: A GeoJSON Feature, content: { application/geo+json: { schema: { type: object } } } }
        "404": { description: "Not visible to the caller or not existing: the two look the same (TDD-0018 F3)" }
        "401": { description: Missing or invalid token }
        "403": { description: The account was deleted }
        "429": { description: "Per-user request limit reached, retry after the Retry-After seconds (TDD-0005)" }
  /v1/shared/{token}:
    get:
      summary: The activity behind a share link, no sign-in (TDD-0018 F10)
      description: Opens only an activity whose visibility is link and whose token matches. Rate limited per address. Carries X-Robots-Tag noindex.
      tags: [Social]
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicActivity" }
        "404": { description: "The token opens nothing (never existed, or the visibility changed)" }
        "429": { description: Per-address limit reached }
  /v1/shared/{token}/track:
    get:
      summary: The track behind a share link, privacy zones cut out
      tags: [Social]
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: A GeoJSON Feature, content: { application/geo+json: { schema: { type: object } } } }
        "404": { description: The token opens nothing }
        "429": { description: Per-address limit reached }
  /v1/users/{id}/follow:
    post:
      summary: Ask to follow a person (TDD-0018 F2)
      description: The follow is a request until the person accepts. A repeat changes nothing. A blocked pair, in either direction, gets 404. At most 200 requests may wait.
      security: [{ oidc: [] }]
      tags: [Social]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The relation after the call
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RelationResult" }
        "400": { description: Yourself }
        "404": { description: "Not visible to the caller or not existing: the two look the same (TDD-0018 F3)" }
        "401": { description: Missing or invalid token }
        "403": { description: The account was deleted }
        "429": { description: "Per-user request limit reached, retry after the Retry-After seconds (TDD-0005)" }
    delete:
      summary: Cancel a request or stop following
      security: [{ oidc: [] }]
      tags: [Social]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Done (also when there was nothing to do) }
        "401": { description: Missing or invalid token }
        "403": { description: The account was deleted }
        "429": { description: "Per-user request limit reached, retry after the Retry-After seconds (TDD-0005)" }
  /v1/me/follow-requests:
    get:
      summary: The requests waiting for the caller's answer; count is the in-app badge
      security: [{ oidc: [] }]
      tags: [Social]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FollowRequests" }
        "401": { description: Missing or invalid token }
        "403": { description: The account was deleted }
        "429": { description: "Per-user request limit reached, retry after the Retry-After seconds (TDD-0005)" }
  /v1/me/follow-requests/{id}/accept:
    post:
      summary: Accept a request (only the followed accepts)
      security: [{ oidc: [] }]
      tags: [Social]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Accepted }
        "404": { description: There is no such request }
        "401": { description: Missing or invalid token }
        "403": { description: The account was deleted }
        "429": { description: "Per-user request limit reached, retry after the Retry-After seconds (TDD-0005)" }
  /v1/me/follow-requests/{id}/decline:
    post:
      summary: Decline a request
      security: [{ oidc: [] }]
      tags: [Social]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Declined }
        "404": { description: There is no such request }
        "401": { description: Missing or invalid token }
        "403": { description: The account was deleted }
        "429": { description: "Per-user request limit reached, retry after the Retry-After seconds (TDD-0005)" }
  /v1/me/followers/{id}:
    delete:
      summary: Remove a follower
      security: [{ oidc: [] }]
      tags: [Social]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Done }
        "401": { description: Missing or invalid token }
        "403": { description: The account was deleted }
        "429": { description: "Per-user request limit reached, retry after the Retry-After seconds (TDD-0005)" }
  /v1/users/{id}/followers:
    get:
      summary: The people who follow a person (up to 200; people blocked with the caller left out)
      security: [{ oidc: [] }]
      tags: [Social]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK; empty for a private profile the caller does not follow
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/UserRef" } }
        "404": { description: "Not visible to the caller or not existing: the two look the same (TDD-0018 F3)" }
        "401": { description: Missing or invalid token }
        "403": { description: The account was deleted }
        "429": { description: "Per-user request limit reached, retry after the Retry-After seconds (TDD-0005)" }
  /v1/users/{id}/following:
    get:
      summary: The people a person follows
      security: [{ oidc: [] }]
      tags: [Social]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK; empty for a private profile the caller does not follow
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/UserRef" } }
        "404": { description: "Not visible to the caller or not existing: the two look the same (TDD-0018 F3)" }
        "401": { description: Missing or invalid token }
        "403": { description: The account was deleted }
        "429": { description: "Per-user request limit reached, retry after the Retry-After seconds (TDD-0005)" }
  /v1/me/blocks:
    get:
      summary: The people the caller blocked
      security: [{ oidc: [] }]
      tags: [Social]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/UserRef" } }
        "401": { description: Missing or invalid token }
        "403": { description: The account was deleted }
        "429": { description: "Per-user request limit reached, retry after the Retry-After seconds (TDD-0005)" }
  /v1/me/blocks/{id}:
    put:
      summary: Block a person (TDD-0018 F7)
      description: The follow is removed in both directions. Unblocking does not bring it back.
      security: [{ oidc: [] }]
      tags: [Social]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Blocked }
        "400": { description: Yourself }
        "404": { description: "Not visible to the caller or not existing: the two look the same (TDD-0018 F3)" }
        "401": { description: Missing or invalid token }
        "403": { description: The account was deleted }
        "429": { description: "Per-user request limit reached, retry after the Retry-After seconds (TDD-0005)" }
    delete:
      summary: Unblock a person
      security: [{ oidc: [] }]
      tags: [Social]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Done }
        "401": { description: Missing or invalid token }
        "403": { description: The account was deleted }
        "429": { description: "Per-user request limit reached, retry after the Retry-After seconds (TDD-0005)" }
  /v1/reports:
    post:
      summary: Report a profile or an activity (TDD-0018 F12)
      description: The reporter can only report what they can see. The same open report twice is one. At most 20 may be open. Kept 6 months, without the reporter once that account is deleted (ADR-0036).
      security: [{ oidc: [] }]
      tags: [Social]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportRequest" }
      responses:
        "201": { description: Filed }
        "404": { description: The target is not visible to the caller }
        "422": { description: "Not a valid report, or the caller reported themselves" }
        "401": { description: Missing or invalid token }
        "403": { description: The account was deleted }
        "429": { description: "Per-user request limit reached, retry after the Retry-After seconds (TDD-0005)" }
  /v1/me:
    delete:
      summary: Delete all of the caller's data held by Averyn (idempotent; the identity at the IdP is not touched, ADR-0017)
      security: [{ oidc: [] }]
      responses:
        "204": { description: Deleted; any further call except this one answers 403 }
        "401": { description: Missing or invalid token }
        "429": { description: "Per-user request limit reached, retry after the Retry-After seconds (TDD-0005)" }
  /v1/me/export:
    get:
      summary: Download all of the caller's data as a ZIP (TDD-0004)
      description: >
        Entries: raw/{clientActivityId}.jsonl (byte-for-byte), original/{clientActivityId}.gpx or .fit (the file an
        imported activity was imported from), rr/{clientActivityId}.rr.jsonl (the heart-rate sidecar),
        gpx/{clientActivityId}.gpx, analysis/{clientActivityId}.json (the splits, the elevation, the series
        and the best efforts of the activity, TDD-0009 and TDD-0010), profile.json, privacy-zones.json (TDD-0016), consents.json, records.json (the personal
        records of the account, TDD-0010) and activities.json (summaries and skipped-line counts, written
        last). Streamed.
      security: [{ oidc: [] }]
      responses:
        "200":
          description: The archive
          content:
            application/zip:
              schema: { type: string, format: binary }
        "401": { description: Missing or invalid token }
        "429": { description: "Per-user request limit reached, retry after the Retry-After seconds (TDD-0005)" }
        "403": { description: The account was deleted }
        "503": { description: "Too many exports in progress, retry after the Retry-After seconds" }
  /v1/me/records:
    get:
      summary: The personal records of the caller — the fastest effort of every sport and distance (TDD-0010)
      description: >
        A record is the fastest eligible best effort of the account for a sport and a distance. An activity is
        eligible when it finished, when it comes from Averyn or from a GPX file, and when its quality is not
        POOR. The number of activities that have no analysis yet is in `pendingActivities`: while it is not
        zero the list can be incomplete.
      security: [{ oidc: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonalRecords" }
        "401": { description: Missing or invalid token }
        "403": { description: The account was deleted (ADR-0017) }
        "429": { description: "Per-user request limit reached, retry after the Retry-After seconds (TDD-0005)" }
components:
  securitySchemes:
    oidc:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token issued by the OIDC provider named in /v1/client-config.
  schemas:
    ClientConfig:
      type: object
      required: [issuer, clientId, webClientId, mapStyleUrl, apiVersion]
      properties:
        issuer: { type: string, format: uri }
        clientId: { type: string, description: The native (mobile) OIDC app }
        webClientId: { type: string, description: The browser OIDC app (same project and audience) }
        mapStyleUrl: { type: string, format: uri, description: MapLibre style for the web basemap (deployment configuration) }
        apiVersion:
          type: integer
          description: "The version of the API contract this server speaks (TDD-0011). A client that does not understand it is warned, never refused: the read path is additive."
          example: 1
        privacyPolicyUrl: { type: [string, "null"], description: "Where the operator publishes its privacy notice (http or https), or null" }
        termsUrl: { type: [string, "null"], description: "Where the operator publishes its terms of service (http or https), or null" }
        minClientVersion:
          type: [string, "null"]
          description: The oldest app version this instance supports (semantic version), null when there is no minimum. A client below it is warned.
          example: "0.1.0"
    ActivitySummary:
      type: object
      required: [id, clientActivityId, sport, startedAt, finalState, distanceM, elapsedMs, movingMs, pausedMs, stationaryMs, averageSpeedMps, qualityGrade, droppedRecords, metricsAlgorithmVersion, qualityAlgorithmVersion, visibility]
      properties:
        id: { type: string, format: uuid }
        clientActivityId: { type: string, format: uuid }
        sport: { type: string, enum: [RUN, RIDE, WALK, HIKE] }
        startedAt: { type: string, format: date-time }
        finalState: { type: string, enum: [COMPLETED, FAILED] }
        distanceM: { type: number }
        elapsedMs: { type: integer, format: int64 }
        movingMs: { type: integer, format: int64 }
        pausedMs: { type: integer, format: int64 }
        stationaryMs: { type: integer, format: int64, description: "time-v1: the time the activity was recording and the user was not moving" }
        averageSpeedMps: { type: number, description: "speed-v1: distance over moving time; 0 while nothing moved" }
        paceSecPerKm: { type: [number, "null"], description: "speed-v1: 1000 / averageSpeedMps; null when the average speed is 0" }
        qualityGrade: { type: string, enum: [GOOD, FAIR, POOR, UNKNOWN], description: "UNKNOWN when the accuracy was never measured (an imported file, TDD-0008)" }
        droppedRecords: { type: integer, description: Stored lines that could not be read (counted, never silently dropped) }
        metricsAlgorithmVersion: { type: string, description: "Comma-separated, e.g. distance-v1,time-v1,speed-v1" }
        qualityAlgorithmVersion: { type: string }
        visibility: { type: string, enum: [private, followers, public, link] }
        avgHrBpm: { type: integer, description: "hr-v2: mean heart rate over the recording; 0 when there is none" }
        maxHrBpm: { type: integer, description: "hr-v2: maximum heart rate; 0 when there is none" }
        hrSource: { type: string, description: "Which sensor produced the heart rate (ble-hr, none, ...)" }
        hrAlgorithmVersion: { type: string, description: "The algorithm that computed the heart rate of this row" }
        source: { type: string, enum: [device, gpx, fit, tcx], description: "Where the activity comes from: recorded or imported (TDD-0008)" }
    ActivityAnalysis:
      type: object
      required: [schemaVersion, algorithmVersions, splitLengthM, totals, splits, series]
      properties:
        schemaVersion: { type: integer, description: The shape of this document; a new shape is a new number }
        algorithmVersions: { $ref: "#/components/schemas/AnalysisVersions" }
        splitLengthM: { type: number, description: "The length of a split: 1000 m, 5000 m for a ride" }
        totals: { $ref: "#/components/schemas/AnalysisTotals" }
        elevation:
          description: "Null when the activity carries no altitude at all"
          oneOf:
            - { $ref: "#/components/schemas/AnalysisElevation" }
            - { type: "null" }
        heartRate:
          description: "Null when the activity has no heart rate"
          oneOf:
            - { $ref: "#/components/schemas/AnalysisHeartRate" }
            - { type: "null" }
        splits:
          type: array
          items: { $ref: "#/components/schemas/AnalysisSplit" }
        bestEfforts:
          type: array
          description: "The fastest window of each target distance of the sport (best-efforts-v1)"
          items: { $ref: "#/components/schemas/BestEffort" }
        series: { $ref: "#/components/schemas/AnalysisSeries" }
        heartRateZones:
          description: >
            The time in each of five heart-rate zones (hr-zones-v1, TDD-0012). Never stored: computed when the
            analysis is read, from the time at each bpm of the series and the maximum heart rate of the caller's
            profile. Absent when the activity has no heart rate or the profile has no maximum.
          oneOf:
            - { $ref: "#/components/schemas/HeartRateZones" }
            - { type: "null" }
    HeartRateZones:
      type: object
      required: [algorithmVersion, maxHrBpm, zones]
      properties:
        algorithmVersion: { type: string, description: "e.g. hr-zones-v1" }
        maxHrBpm: { type: integer, description: "The maximum heart rate the zones were cut from" }
        zones:
          type: array
          description: "Five zones, from 1 to 5"
          items:
            type: object
            required: [zone, fromBpm, toBpm, timeMs]
            properties:
              zone: { type: integer, minimum: 1, maximum: 5 }
              fromBpm: { type: integer }
              toBpm: { type: [integer, "null"], description: "Null for the last zone, which has no upper limit" }
              timeMs: { type: integer, format: int64 }
    AnalysisVersions:
      type: object
      required: [splits, elevation, series, heartRate]
      properties:
        splits: { type: string, description: "e.g. splits-v1" }
        elevation: { type: string, description: "e.g. elevation-v1" }
        series: { type: string, description: "e.g. series-v1" }
        heartRate: { type: string, description: "e.g. hr-v2" }
        bestEfforts: { type: string, description: "e.g. best-efforts-v1" }
    BestEffort:
      type: object
      required: [distanceM, durationMs, elapsedMs, startDistanceM, endDistanceM, startElapsedMs, endElapsedMs, avgSpeedMps]
      properties:
        distanceM: { type: number, description: "The distance of the effort: one of the targets of the sport" }
        durationMs: { type: integer, format: int64, description: "The moving time of the effort: what a record is made of" }
        elapsedMs: { type: integer, format: int64, description: "The wall time of the effort, the stops inside it included" }
        startDistanceM: { type: number, description: "Where the effort starts, on the cumulative distance of the activity" }
        endDistanceM: { type: number, description: "Where the effort ends, on the cumulative distance of the activity" }
        startElapsedMs: { type: integer, format: int64, description: "When the effort starts, from the first sample of the activity" }
        endElapsedMs: { type: integer, format: int64, description: "When the effort ends, from the first sample of the activity" }
        avgSpeedMps: { type: number }
        paceSecPerKm: { type: [number, "null"], description: "Null when the effort does not move" }
    PersonalRecords:
      type: object
      required: [algorithmVersion, pendingActivities, sports]
      properties:
        algorithmVersion: { type: string, description: "The version of the algorithm that produced the numbers" }
        pendingActivities:
          type: integer
          description: "The activities of the account that have no analysis yet: the records can be incomplete while this is not zero"
        sports:
          type: array
          items: { $ref: "#/components/schemas/SportRecords" }
    SportRecords:
      type: object
      required: [sport, targets]
      properties:
        sport: { type: string, enum: [RUN, RIDE, WALK, HIKE] }
        targets:
          type: array
          items: { $ref: "#/components/schemas/RecordTarget" }
    RecordTarget:
      type: object
      required: [distanceM, record]
      properties:
        distanceM: { type: number, description: "The target distance of the sport" }
        record:
          description: "Null when the account has no record of this distance yet"
          oneOf:
            - { $ref: "#/components/schemas/PersonalRecord" }
            - { type: "null" }
    PersonalRecord:
      type: object
      required: [activityId, achievedAt, durationMs, elapsedMs, avgSpeedMps, source, qualityGrade]
      properties:
        activityId: { type: string, format: uuid, description: "The activity the record was made in" }
        achievedAt: { type: string, format: date-time, description: "When it was made: the start of the activity" }
        durationMs: { type: integer, format: int64, description: "The moving time of the effort" }
        elapsedMs: { type: integer, format: int64, description: "The wall time of the effort" }
        avgSpeedMps: { type: number }
        paceSecPerKm: { type: [number, "null"] }
        source: { type: string, enum: [device, gpx, fit, tcx], description: "Where the activity comes from" }
        qualityGrade: { type: string, enum: [GOOD, FAIR, POOR, UNKNOWN] }
    AnalysisTotals:
      type: object
      required: [distanceM, elapsedMs, movingMs, pausedMs, stationaryMs]
      properties:
        distanceM: { type: number }
        elapsedMs: { type: integer, format: int64 }
        movingMs: { type: integer, format: int64 }
        pausedMs: { type: integer, format: int64 }
        stationaryMs: { type: integer, format: int64 }
    AnalysisElevation:
      type: object
      required: [source, gainM, lossM, minM, maxM, avgM, coveragePercent]
      properties:
        source: { type: string, enum: [recorded], description: "The altitude comes from the samples, not from a digital elevation model" }
        gainM: { type: number, description: "elevation-v1: the climb, with a 3 m threshold" }
        lossM: { type: number, description: "elevation-v1: the descent, with a 3 m threshold" }
        minM: { type: number }
        maxM: { type: number }
        avgM: { type: number }
        coveragePercent: { type: number, description: "The share of the samples that carried an altitude" }
    AnalysisHeartRate:
      type: object
      required: [minBpm, avgBpm, maxBpm, coveragePercent, dropouts, artifacts]
      properties:
        minBpm: { type: integer }
        avgBpm: { type: integer }
        maxBpm: { type: integer }
        coveragePercent: { type: number, description: "hr-v2: the share of the recording time, the pauses excluded" }
        dropouts: { type: integer, description: "The expected 1 s intervals of the recording time without a usable sample" }
        artifacts: { type: integer, description: "The samples outside the plausible range: counted, never used" }
    AnalysisSplit:
      type: object
      required: [index, startDistanceM, endDistanceM, elapsedMs, movingMs, avgSpeedMps, partial]
      properties:
        index: { type: integer, description: "The 1-based position of the split" }
        startDistanceM: { type: number }
        endDistanceM: { type: number }
        elapsedMs: { type: integer, format: int64, description: "The wall time of the split, a pause inside it included" }
        movingMs: { type: integer, format: int64, description: "The time the user was moving: the pace is computed on this" }
        avgSpeedMps: { type: number }
        elevationGainM: { type: [number, "null"], description: "Null when the activity has no altitude" }
        elevationLossM: { type: [number, "null"], description: "Null when the activity has no altitude" }
        avgHrBpm: { type: [integer, "null"], description: "Null when the split has no heart-rate sample" }
        partial: { type: boolean, description: "True for the last split when the activity ended before the next boundary" }
    AnalysisSeries:
      type: object
      required: [distanceM, elevationM, elapsedMs, segment, heartRate]
      description: "A bounded, decimated drawing of the activity: the numbers to trust are the splits and the totals"
      properties:
        distanceM:
          type: array
          items: { type: number }
        elevationM:
          type: array
          items: { type: [number, "null"], description: "Null where the altitude is not known" }
        elapsedMs:
          type: array
          items: { type: integer, format: int64 }
        segment:
          type: array
          items: { type: integer, description: "The recording interval of the point: a change of number is a pause" }
        heartRate: { $ref: "#/components/schemas/AnalysisHeartRateSeries" }
    AnalysisHeartRateSeries:
      type: object
      required: [elapsedMs, bpm, segment]
      properties:
        elapsedMs:
          type: array
          items: { type: integer, format: int64 }
        bpm:
          type: array
          items: { type: integer }
        segment:
          type: array
          items: { type: integer, description: "The stretch of the point: a change of number is a dropout of the sensor" }
        timeAtBpm:
          type: object
          description: "The milliseconds spent at each bpm (series-v2). Not decimated: the zones are made of it"
          properties:
            fromBpm: { type: integer }
            timeMs:
              type: array
              description: "timeMs[i] is the time at fromBpm + i bpm"
              items: { type: integer, format: int64 }
    ImportResponse:
      type: object
      required: [activity, import]
      properties:
        activity: { $ref: "#/components/schemas/ActivitySummary" }
        import: { $ref: "#/components/schemas/ImportReport" }
    ImportReport:
      type: object
      required: [source, duplicate, ignoredExtensions, parserVersion]
      properties:
        source: { type: string, description: "The format that was imported" }
        duplicate: { type: boolean, description: "True when this exact file was already imported" }
        segments: { type: [integer, "null"], description: "The number of track segments; null when the file was not parsed (a duplicate)" }
        points: { type: [integer, "null"], description: "The number of track points; null when the file was not parsed (a duplicate)" }
        ignoredExtensions: { type: object, additionalProperties: { type: integer }, description: "The extensions found in the file and not imported, by name" }
        parserVersion: { type: string, description: "e.g. gpx-import-v1, fit-import-v1" }
        heartRateReadings: { type: [integer, "null"], description: "The number of heart-rate readings imported; null when the file was not parsed (a duplicate)" }
    ArchiveReport:
      type: object
      required: [created, duplicates, refused, skipped, ignoredFiles, entries]
      properties:
        created: { type: integer }
        duplicates: { type: integer, description: "Files that were already imported: nothing was stored a second time" }
        refused: { type: integer }
        skipped: { type: integer, description: "Files not tried because the storage quota was reached" }
        ignoredFiles: { type: integer, description: "Files of the archive that are not activity files (notes, photos): not read" }
        entries:
          type: array
          items:
            type: object
            required: [name, status]
            properties:
              name: { type: string, description: "The path of the file in the archive" }
              status: { type: string, enum: [created, duplicate, refused, skipped] }
              activityId: { type: [string, "null"] }
              code: { type: [string, "null"], description: "Why the file was refused or skipped (the codes of the single imports, entry_too_large, entry_unreadable, quota_exceeded)" }
              message: { type: [string, "null"] }
    UserProfile:
      type: object
      properties:
        units: { type: string, enum: [metric, imperial], default: metric }
        maxHrBpm: { type: [integer, "null"], minimum: 100, maximum: 230, default: null }
    SocialProfile:
      type: object
      properties:
        handle: { type: [string, "null"], pattern: "^[a-z0-9_.]{3,30}$" }
        displayName: { type: [string, "null"], minLength: 1, maxLength: 40 }
        bio: { type: [string, "null"], maxLength: 160 }
        sport: { type: [string, "null"], maxLength: 30 }
        profilePrivate: { type: boolean, default: false }
        defaultVisibility: { type: string, enum: [private, followers, public], default: private, description: "Only for new activities; link is not allowed because its token is made per activity" }
        ageConfirmed: { type: boolean, default: false, description: "Input: the user says they are 16 or older. Output: it was said" }
        hasAvatar: { type: boolean, description: Output only }
        id: { type: [string, "null"], format: uuid, description: "Output only: the account's opaque id" }
    UserRef:
      type: object
      required: [id, hasAvatar]
      properties:
        id: { type: string, format: uuid }
        handle: { type: [string, "null"] }
        displayName: { type: [string, "null"] }
        hasAvatar: { type: boolean }
    UserCard:
      type: object
      required: [id, hasAvatar, relation, restricted]
      properties:
        id: { type: string, format: uuid }
        handle: { type: [string, "null"] }
        displayName: { type: [string, "null"] }
        bio: { type: [string, "null"], description: Null when restricted }
        sport: { type: [string, "null"], description: Null when restricted }
        hasAvatar: { type: boolean }
        relation: { type: string, enum: [self, none, requested, following, blocked] }
        restricted: { type: boolean }
    PublicActivity:
      type: object
      description: An activity as a non-owner sees it. It has no heart-rate, RR, HRV or stress field (ADR-0013).
      required: [id, ownerId, sport, startedAt, distanceM, elapsedMs, movingMs, averageSpeedMps]
      properties:
        id: { type: string, format: uuid }
        ownerId: { type: string, format: uuid }
        sport: { type: string }
        startedAt: { type: string, format: date-time }
        distanceM: { type: number }
        elapsedMs: { type: integer, format: int64 }
        movingMs: { type: integer, format: int64 }
        averageSpeedMps: { type: number }
        paceSecPerKm: { type: [number, "null"] }
    PublicActivityPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/PublicActivity" } }
        nextCursor: { type: [string, "null"] }
    VisibilityRequest:
      type: object
      required: [visibility]
      properties:
        visibility: { type: string, enum: [private, followers, public, link] }
    VisibilityResult:
      type: object
      required: [visibility]
      properties:
        visibility: { type: string, enum: [private, followers, public, link] }
        shareToken: { type: [string, "null"], description: Only for link }
    RelationResult:
      type: object
      required: [relation]
      properties:
        relation: { type: string, enum: [self, none, requested, following, blocked] }
    FollowRequests:
      type: object
      required: [count, items]
      properties:
        count: { type: integer }
        items: { type: array, items: { $ref: "#/components/schemas/UserRef" } }
    ReportRequest:
      type: object
      required: [targetUserId, reason]
      properties:
        targetUserId: { type: string, format: uuid }
        targetActivityId: { type: [string, "null"], format: uuid }
        reason: { type: string, enum: [spam, abuse, impersonation, privacy, minor, illegal, other] }
        note: { type: [string, "null"], maxLength: 500 }
    PrivacyZone:
      type: object
      required: [latitude, longitude, radiusM]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        radiusM: { type: integer, minimum: 50, maximum: 2000 }
        label: { type: [string, "null"], maxLength: 40, description: A name for the user's own list; never drawn on a map }
    PrivacyZones:
      type: object
      properties:
        zones: { type: array, maxItems: 10, items: { $ref: "#/components/schemas/PrivacyZone" }, default: [] }
    ConsentGrant:
      type: object
      required: [scope, grantedAt, revokedAt]
      properties:
        scope: { type: string }
        grantedAt: { type: string, format: date-time }
        revokedAt: { type: [string, "null"], format: date-time }
    ActivityPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ActivitySummary" }
        nextCursor: { type: [string, "null"], description: Null on the last page }
    Status:
      type: object
      required: [status]
      properties:
        status: { type: string }
