name: Release (tester build)

# Manual only. Builds the Android tester bundle (AAB) and attaches it to the run; uploading it to Play internal
# testing, and building/uploading the iOS app to TestFlight, are manual steps for now
# (docs/deployment/tester-builds.md, ADR-0019). It needs the signing secrets listed there and fails with a clear
# message when they are missing, instead of producing an unsigned bundle nobody can install.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "versionName shown to testers, e.g. 0.1.0-beta.1"
        required: true

permissions:
  contents: read

jobs:
  android:
    name: Android tester bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Decode the upload keystore
        env:
          AVERYN_KEYSTORE_BASE64: ${{ secrets.AVERYN_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$AVERYN_KEYSTORE_BASE64" ]; then
            echo "::error::secret AVERYN_KEYSTORE_BASE64 is not set, see docs/deployment/tester-builds.md"
            exit 1
          fi
          echo "$AVERYN_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "AVERYN_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build the signed bundle
        env:
          AVERYN_KEYSTORE_PASSWORD: ${{ secrets.AVERYN_KEYSTORE_PASSWORD }}
          AVERYN_KEY_ALIAS: ${{ secrets.AVERYN_KEY_ALIAS }}
          AVERYN_KEY_PASSWORD: ${{ secrets.AVERYN_KEY_PASSWORD }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: >
          ./gradlew :apps:android:bundleRelease --console=plain
          -Paveryn.versionCode=${{ github.run_number }}
          -Paveryn.versionName="$VERSION_NAME"
          -Paveryn.commit=${{ github.sha }}
      - uses: actions/upload-artifact@v7
        with:
          name: averyn-android-${{ inputs.version_name }}
          path: apps/android/build/outputs/bundle/release/*.aab
          if-no-files-found: error
