# DEPRECATED (2026-11-19): GitHub Actions is not the CI gate. This workflow is
# disabled and kept only for history. PR titles are checked in review; the gate
# is .woodpecker/ci.yml. Do not re-enable without an ADR.
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-commits:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          scopes: |
            tracking
            metrics
            domain
            backend
            android
            ios
            web
            sync
            infra
            docs
            deps
            ci
            import
            records
          requireScope: false
