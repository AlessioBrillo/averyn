name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.f.outputs.ios }}
    steps:
      - uses: actions/checkout@v7
      - id: f
        uses: dorny/paths-filter@v4
        with:
          filters: |
            ios:
              - 'apps/ios/**'
              - 'shared/**'
              - 'build-logic/**'
              - 'gradle/**'
              - '*.gradle.kts'
              - '.github/workflows/ci.yml'

  jvm:
    name: JVM (shared, backend, ktlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # `check` = tests + ktlint for every module that runs on the JVM/Android host.
      - run: ./gradlew check --console=plain

  android:
    name: Android (assembleDebug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :apps:android:assembleDebug :apps:android:lintDebug --console=plain

  ios:
    name: iOS (shared framework + app build)
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :shared:domain:iosSimulatorArm64Test :shared:metrics:iosSimulatorArm64Test :shared:tracking:iosSimulatorArm64Test --console=plain
      - run: brew install xcodegen
      - name: Build app for simulator
        working-directory: apps/ios
        run: |
          xcodegen
          # EXCLUDED_ARCHS=x86_64: the generic simulator destination requests an Intel slice we
          # don't build (no iosX64 target — nothing here runs on an Intel simulator).
          xcodebuild build -project Averyn.xcodeproj -scheme Averyn \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO EXCLUDED_ARCHS=x86_64

  web:
    name: Web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # The map's worker is a separate module a bundler does not emit unless asked (ActivityDetail.tsx): a missing
      # file only shows up in a browser as a blank map.
      - run: ls dist/assets | grep -q '^maplibre-gl-worker-.*\.js$'

  docs:
    name: Docs (markdown, links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: |
            **/*.md
            !docs/product/reference-report-v0.1.md
            !docs/strategy/00-visione-strategica-completa.md
            !docs/strategy/01-synapse24-restructure-plan.md
            !docs/strategy/02-averyn-synapse-integration.md
            !docs/strategy/03-synapse-cloud-adr.md
            !docs/strategy/04-synapse-device-sdk-spec.md
            !docs/strategy/05-master-index.md
            !LICENSE
            !**/node_modules/**
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --offline --include-fragments './**/*.md'
          fail: true

  compose:
    name: Compose stack smoke test
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose -f infrastructure/compose/docker-compose.yml --env-file infrastructure/compose/.env
    steps:
      - uses: actions/checkout@v7
      # The clean-machine path of the self-hosting guide: generated secrets, generated object-store identity.
      - run: sh infrastructure/compose/init-env.sh
      - name: Start the stack
        run: $COMPOSE up -d --build || { $COMPOSE logs --no-color; exit 1; }
      - name: Wait for /ready (DB migrated with PostGIS)
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/ready && exit 0
            sleep 5
          done
          $COMPOSE logs
          exit 1
      - run: $COMPOSE exec -T db psql -U averyn -d averyn -tAc "select postgis_version()"
      - name: The services others depend on are healthy
        run: |
          for i in $(seq 1 30); do
            [ "$($COMPOSE ps --format '{{.Service}} {{.Health}}' | grep -cE '^(db|storage|idp|backend) healthy$')" = 4 ] && exit 0
            sleep 2
          done
          $COMPOSE ps --format '{{.Service}} {{.Health}}'
          exit 1
      - name: Identity provider is up and idp-init created the OIDC app
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://idp.localhost:8081/.well-known/openid-configuration | grep -q '"issuer":"http://idp.localhost:8081"' && break
            sleep 5
          done
          for i in $(seq 1 30); do
            [ "$($COMPOSE ps -a --format '{{.State}}' idp-init)" = exited ] && break
            sleep 2
          done
          [ "$($COMPOSE ps -a --format '{{.ExitCode}}' idp-init)" = 0 ] || { $COMPOSE logs idp idp-init; exit 1; }
          $COMPOSE logs idp-init | grep -q 'identity provider ready: project [0-9]*, client [0-9]*'
      - name: Backend serves the OIDC client config and protects activities
        run: |
          curl -fsS http://127.0.0.1:8080/v1/client-config | grep -q '"issuer":"http://idp.localhost:8081","clientId":"[0-9]*"'
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/v1/activities/00000000-0000-0000-0000-000000000000)" = 401 ]
      - name: Web app is served and proxies the API (same origin)
        run: |
          curl -fsS http://127.0.0.1:8082/ | grep -q '<div id="root">'
          curl -sSI http://127.0.0.1:8082/ | grep -qi "^content-security-policy: default-src 'none'; script-src 'self';.*connect-src 'self' http://idp.localhost:8081 https://demotiles.maplibre.org;"
          curl -sSI http://127.0.0.1:8082/activities/x | grep -qi "^content-security-policy: .*frame-ancestors 'none'"
          curl -fsS http://127.0.0.1:8082/activities/00000000-0000-0000-0000-000000000000 | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1:8082/v1/client-config | grep -q '"webClientId":"[0-9]*","mapStyleUrl":"https'
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8082/v1/activities)" = 401 ]
          # /metrics is not proxied (it falls through to the SPA page), and the web container logs no request paths
          ! curl -fsS http://127.0.0.1:8082/metrics | grep -q '^# HELP' || exit 1
          ! $COMPOSE logs --no-color web | grep -q 'activities' || exit 1
      - if: always()
        run: $COMPOSE down -v

  compose-tls:
    name: Compose TLS overlay smoke test
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose -f infrastructure/compose/docker-compose.yml -f infrastructure/compose/docker-compose.tls.yml --env-file infrastructure/compose/.env
    steps:
      - uses: actions/checkout@v7
      - run: |
          sh infrastructure/compose/init-env.sh
          printf 'IDP_HOST=auth.averyn.localhost\nAVERYN_DOMAIN=averyn.localhost\n' >> infrastructure/compose/.env
      - name: Start the stack
        run: $COMPOSE up -d --build || { $COMPOSE logs --no-color; exit 1; }
      - name: Only the edge publishes ports
        run: |
          $COMPOSE ps --format '{{.Service}} {{.Ports}}'
          [ -z "$($COMPOSE ps --format '{{.Service}} {{.Ports}}' | grep -- '->' | grep -v '^web ')" ]
      - name: Fetch the root of Caddy's local CA (*.localhost certificates)
        run: |
          for i in $(seq 1 30); do
            $COMPOSE cp web:/data/caddy/pki/authorities/local/root.crt root.crt && break
            sleep 2
          done
          test -s root.crt
      - name: The identity provider publishes the https issuer through the edge
        run: |
          for i in $(seq 1 40); do
            curl -fsS --cacert root.crt https://auth.averyn.localhost/.well-known/openid-configuration \
              | grep -q '"issuer":"https://auth.averyn.localhost"' && break
            sleep 5
          done
          for i in $(seq 1 30); do
            [ "$($COMPOSE ps -a --format '{{.State}}' idp-init)" = exited ] && break
            sleep 2
          done
          [ "$($COMPOSE ps -a --format '{{.ExitCode}}' idp-init)" = 0 ] || { $COMPOSE logs idp idp-init; exit 1; }
      - name: Web app and API over https only
        run: |
          for i in $(seq 1 30); do
            curl -fsS --cacert root.crt https://averyn.localhost/v1/client-config \
              | grep -q '"issuer":"https://auth.averyn.localhost"' && break
            sleep 5
          done
          curl -fsS --cacert root.crt https://averyn.localhost/v1/client-config | grep -q '"issuer":"https://auth.averyn.localhost"'
          curl -fsS --cacert root.crt https://averyn.localhost/ | grep -q '<div id="root">'
          curl -sSI --cacert root.crt https://averyn.localhost/ | grep -qi '^strict-transport-security: max-age='
          curl -sSI --cacert root.crt https://averyn.localhost/ | grep -qi "^content-security-policy: .*connect-src 'self' https://auth.averyn.localhost "
          [ "$(curl -s --cacert root.crt -o /dev/null -w '%{http_code}' https://averyn.localhost/v1/activities)" = 401 ]
          [ "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' http://averyn.localhost/)" = "308 https://averyn.localhost/" ]
          ! curl -fsS --cacert root.crt https://averyn.localhost/metrics | grep -q '^# HELP' || exit 1
      - if: always()
        run: $COMPOSE down -v
