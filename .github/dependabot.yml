version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule: { interval: weekly }
    groups:
      gradle-minor-patch:
        update-types: [minor, patch]
    ignore:
      # 1.12 no longer fails an upload whose sample breaks the model: https://github.com/AlessioBrillo/averyn/issues/80
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-serialization-*"
        versions: ["1.12.x"]
    commit-message: { prefix: "chore(deps)" }
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly }
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    commit-message: { prefix: "chore(deps)" }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "chore(ci)" }
  - package-ecosystem: docker
    directory: /infrastructure/docker
    schedule: { interval: weekly }
    commit-message: { prefix: "chore(deps)" }
  - package-ecosystem: docker-compose
    directory: /infrastructure/compose
    schedule: { interval: weekly }
    commit-message: { prefix: "chore(deps)" }
