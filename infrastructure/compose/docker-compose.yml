# Local development and single-node self-hosting stack.
#   cp .env.example .env   # then edit secrets
#   docker compose --env-file .env up -d --build
name: averyn

services:
  db:
    image: postgis/postgis:18-3.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-averyn}
      POSTGRES_USER: ${POSTGRES_USER:-averyn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # postgres 18's images changed the expected mount point from .../data to a single mount at
      # /var/lib/postgresql (pg_ctlcluster-style, major-version-subdirectories) — the old path makes the
      # entrypoint refuse to start ("these Docker images are configured to store database data in a format
      # which is compatible with pg_ctlcluster"). See https://github.com/docker-library/postgres/pull/1259.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  storage:
    # S3-compatible object storage (ADR-0006). Any S3 API implementation can replace it.
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command: ["server", "-dir=/data", "-s3", "-s3.config=/etc/seaweedfs/s3.json"]
    volumes:
      - storage-data:/data
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro

  # Identity provider (ADR-0011): Zitadel, one container on the shared PostgreSQL server (it creates and owns
  # its own `zitadel` database). The issuer URL is http://${IDP_HOST}:${IDP_PORT}. The `aliases` entry makes that
  # same hostname resolve to this container inside the Compose network, so the backend and the phone / browser
  # see one identical issuer (the `iss` claim must match exactly). Zitadel also listens on IDP_PORT.
  idp:
    image: ghcr.io/zitadel/zitadel:v4.19.4
    restart: unless-stopped
    command: start-from-init --masterkey "${ZITADEL_MASTERKEY:?set ZITADEL_MASTERKEY in .env (32 characters)}" --tlsMode disabled
    depends_on:
      db:
        condition: service_healthy
      idp-perms:
        condition: service_completed_successfully
    environment:
      ZITADEL_PORT: ${IDP_PORT:-8081}
      ZITADEL_EXTERNALDOMAIN: ${IDP_HOST:-idp.localhost}
      ZITADEL_EXTERNALPORT: ${IDP_PORT:-8081}
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_DATABASE_POSTGRES_HOST: db
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${ZITADEL_DB_PASSWORD:?set ZITADEL_DB_PASSWORD in .env}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: ${POSTGRES_USER:-averyn}
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${POSTGRES_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      # Console admin: login name admin@zitadel.${IDP_HOST}. A machine user's PAT lets idp-init create the OIDC app.
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: admin
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_ADMIN_PASSWORD:?set ZITADEL_ADMIN_PASSWORD in .env}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_PATPATH: /bootstrap/admin.pat
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "false"
    volumes:
      - idp-bootstrap:/bootstrap
    networks:
      default:
        aliases:
          - ${IDP_HOST:-idp.localhost}
    ports:
      # Bound to localhost by default; set AVERYN_BIND=0.0.0.0 to sign in from a phone on the LAN.
      - "${AVERYN_BIND:-127.0.0.1}:${IDP_PORT:-8081}:${IDP_PORT:-8081}"

  # One-shot: Zitadel (uid 1000) and idp-init (curl_user, uid 100) run as non-root, a fresh named volume is root-owned.
  idp-perms:
    image: curlimages/curl:8.22.0
    user: root
    entrypoint: ["/bin/sh", "-c", "chown 1000:1000 /bootstrap && chown 100:101 /oidc"]
    volumes:
      - idp-bootstrap:/bootstrap
      - oidc-config:/oidc

  # One-shot, idempotent: creates the Averyn project and its public (PKCE) OIDC app in Zitadel, then writes
  # the generated ids to oidc.env for the backend. The PAT volume is not mounted anywhere else.
  idp-init:
    image: curlimages/curl:8.22.0
    depends_on:
      idp:
        condition: service_started
      idp-perms:
        condition: service_completed_successfully
    environment:
      IDP_PORT: ${IDP_PORT:-8081}
      # The issuer as clients see it (docker-compose.tls.yml makes it https://IDP_HOST).
      IDP_ISSUER: http://${IDP_HOST:-idp.localhost}:${IDP_PORT:-8081}
      # Public URL of the web app (must be exactly what users type): the browser app's redirect is registered with it.
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:${WEB_PORT:-8082}}
    entrypoint: ["/bin/sh", "/idp-init.sh"]
    volumes:
      - idp-bootstrap:/bootstrap:ro
      - oidc-config:/oidc
      - ./idp-init.sh:/idp-init.sh:ro

  backend:
    build:
      context: ../..
      dockerfile: infrastructure/docker/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_started
      idp-init:
        condition: service_completed_successfully
    # The OIDC issuer/audience/client id are generated by idp-init: load them, then start the backend.
    # Bring your own IdP by replacing this entrypoint and setting AVERYN_OIDC_* directly (see self-hosting).
    entrypoint: ["/bin/sh", "-c", "set -a; . /oidc/oidc.env; exec /opt/backend/bin/backend"]
    volumes:
      - oidc-config:/oidc:ro
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-averyn}
      DATABASE_USER: ${POSTGRES_USER:-averyn}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      # Raw activity files (ADR-0016). These match the identity in seaweedfs-s3.json: change both together.
      AVERYN_S3_ENDPOINT: http://storage:8333
      AVERYN_S3_BUCKET: averyn
      AVERYN_S3_ACCESS_KEY: ${S3_ACCESS_KEY:-averyn-dev-access}
      AVERYN_S3_SECRET_KEY: ${S3_SECRET_KEY:-averyn-dev-secret-change-me}
      # Web basemap (MapLibre style URL). Empty = a demo style; the tile host sees the areas users view.
      AVERYN_MAP_STYLE_URL: ${AVERYN_MAP_STYLE_URL:-}
    ports:
      # Bound to localhost; put a reverse proxy (Caddy/nginx) in front for public access.
      # /metrics is unauthenticated: never expose it publicly (ADR-0009).
      - "${AVERYN_BIND:-127.0.0.1}:${BACKEND_PORT:-8080}:8080"

  # Web app (TDD-0003): static SPA + reverse proxy for /v1. Browse to WEB_ORIGIN (default http://localhost:8082).
  web:
    build:
      context: ../../apps/web
      dockerfile: ../../infrastructure/docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web.caddy:/etc/caddy/web.caddy:ro
    ports:
      - "${AVERYN_BIND:-127.0.0.1}:${WEB_PORT:-8082}:80"

volumes:
  db-data:
  storage-data:
  idp-bootstrap:
  oidc-config:
