# XcodeGen spec. Generate the project with `xcodegen` (the .xcodeproj is not committed).
# The `Shared` framework is built from the KMP modules by the pre-build script.
name: Averyn
options:
  bundleIdPrefix: dev.averyn
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
packages:
  AppAuth:
    url: https://github.com/openid/AppAuth-iOS
    from: 2.0.0
targets:
  Averyn:
    type: application
    platform: iOS
    sources: [Averyn]
    dependencies:
      - package: AppAuth
    info:
      path: Averyn/Info.plist
      properties:
        CFBundleDisplayName: Averyn
        UILaunchScreen: {}
        # TDD-0001 §5.5: background location mode, required for recording with the screen locked.
        # `processing`: the background sync task (TDD-0002 §5.7).
        UIBackgroundModes: [location, processing]
        BGTaskSchedulerPermittedIdentifiers: [dev.averyn.app.sync]
        # Redirect scheme of the sign-in flow; must match infrastructure/compose/idp-init.sh.
        CFBundleURLTypes:
          - CFBundleURLSchemes: [dev.averyn.app]
        # The dev stack is plain HTTP (a LAN address). PoC builds are internal (TDD-0001 §7): remove this and
        # serve the stack over HTTPS before any store distribution.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocationWhenInUseUsageDescription: "Averyn uses your location to record your activity's route, distance and pace."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Averyn uses your location to keep recording your activity while your phone is locked or the app is in the background."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.averyn.app
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../../shared/ios-umbrella/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: ["-framework", "Shared"]
    preBuildScripts:
      - name: Build Shared (KMP)
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/../.."
          ./gradlew :shared:ios-umbrella:embedAndSignAppleFrameworkForXcode
